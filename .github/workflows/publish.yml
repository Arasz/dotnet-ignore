name: publish

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for NuGet Trusted Publishing (OIDC token issuance)

jobs:
  publish:
    # Push to master (a merge is a push) or manual dispatch: the run executes
    # from refs/heads/master, which is the only source the 'production'
    # environment's branch policy allows.
    runs-on: ubuntu-latest
    # The NuGet Trusted Publishing policy 'Dotnet Ignore' is bound to the
    # 'production' environment (verified live: the token exchange rejects any
    # other name with HTTP 401). The required reviewer configured on this
    # environment pauses the run until it is approved in the UI.
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build src/CliTool/CliTool.csproj -c Release

      - name: Pack
        run: dotnet pack src/CliTool/CliTool.csproj -c Release --no-build -o ./artifacts

      - name: NuGet login (OIDC to temporary API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: Arasz

      - name: Push to NuGet
        run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json
