name: publish

on:
  pull_request:
    types: [closed]
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # required for NuGet Trusted Publishing (OIDC token issuance)
  pull-requests: write # to remove the 'latest' label after a successful publish

jobs:
  publish:
    # Auto-trigger: a PR labeled 'latest' merged to master. Manual dispatch always runs.
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'latest'))
    runs-on: ubuntu-latest
    # Approval gate: the whole run waits here until the run is approved in the UI.
    # Configure the required reviewers in Settings -> Environments -> publish.
    environment: publish
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build src/CliTool/CliTool.csproj -c Release

      - name: Pack
        run: dotnet pack src/CliTool/CliTool.csproj -c Release --no-build -o ./artifacts

      - name: NuGet login (OIDC to temporary API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: Arasz

      - name: Push to NuGet
        run: dotnet nuget push ./artifacts/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json

      - name: Mark release done
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr edit "$PR_NUMBER" --remove-label latest || true
          gh pr comment "$PR_NUMBER" --body "Released as dotnet-ignore $(ls ./artifacts/*.nupkg | head -1 | grep -oE '[0-9]+\.[0-9]+\.[0-9]+') on NuGet." || true
