# Path-based PR labeling for actions/labeler@v7.

dotnet:
  - changed-files:
      - any-glob-to-any-file:
          - src/**
          - test/**

ci:
  - changed-files:
      - any-glob-to-any-file:
          - .github/**

documentation:
  - changed-files:
      - any-glob-to-any-file:
          - README.md
          - CHANGELOG.md
          - docs/**
